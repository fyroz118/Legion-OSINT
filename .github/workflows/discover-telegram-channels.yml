name: Discover Telegram channel candidates

on:
  schedule:
    - cron: "17 * * * *" # Every hour at minute 17 UTC; offset avoids top-of-hour load
  workflow_dispatch:
    inputs:
      run_note:
        description: "Optional discovery note"
        required: false
        type: string
        default: "Global discovery; Bangladesh priority"

permissions:
  contents: write

concurrency:
  group: legion-osint-channel-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate discovery script
        run: python -m py_compile scripts/discover_telegram_channels.py
      - name: Test URL and HTML parsing
        run: python -c "import runpy; runpy.run_path('scripts/discover_telegram_channels.py', run_name='discovery_test')['self_test']()"
      - name: Discover public Telegram channel candidates
        run: python scripts/discover_telegram_channels.py
      - name: Persist cumulative candidate registry
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery/
          if ! git diff --cached --quiet; then
            git commit -m "Update automated Telegram channel discovery registry"
            git push
          fi
      - name: Upload candidate registry and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legion-osint-telegram-discovery
          path: discovery/
          if-no-files-found: warn
          retention-days: 30
