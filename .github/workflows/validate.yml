name: Validate Legion-OSINT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Validate Python syntax and JSON configuration
        run: python scripts/validate_project.py
      - name: Compile scripts
        run: python -m py_compile scripts/*.py app/*.py
      - name: Run database regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build application image
        run: docker build --tag legion-osint:ci .
