name: Legion-OSINT scheduled public Telegram collection

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legion-osint-scheduled-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect current-day public Telegram posts
        env:
          COLLECT_LIMIT_PER_CHANNEL: "100"
          PYTHONUNBUFFERED: "1"
        run: python scripts/collect_public_telegram.py
      - name: Publish collection for the Telegram bot
        uses: actions/upload-artifact@v4
        with:
          name: legion-osint-public-telegram-latest
          path: output/*/
          if-no-files-found: error
          retention-days: 7
