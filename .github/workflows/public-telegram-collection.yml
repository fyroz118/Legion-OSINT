name: Legion-OSINT scheduled public Telegram collection

on:
  push:
    paths:
      - "config/channels.json"
      - "config/news_sources.json"
      - "scripts/collect_public_rss.py"
      - "scripts/collect_public_telegram.py"
      - "scripts/publish_tbc_feed.py"
      - ".github/workflows/public-telegram-collection.yml"
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legion-osint-scheduled-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect current-day public Telegram posts
        env:
          COLLECT_LIMIT_PER_CHANNEL: "100"
          PYTHONUNBUFFERED: "1"
        run: python scripts/collect_public_telegram.py
      - name: Collect public RSS and Atom news headlines
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/collect_public_rss.py
      - name: Build bounded public-source feed for TBC
        run: python scripts/publish_tbc_feed.py
      - name: Publish collection artifact for audit and fallback
        uses: actions/upload-artifact@v4
        with:
          name: legion-osint-public-telegram-latest
          path: output/*/
          if-no-files-found: error
          retention-days: 7
      - name: Publish read-only TBC feed snapshot
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed/latest.json docs/feed/archive/
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest public Telegram feed snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
