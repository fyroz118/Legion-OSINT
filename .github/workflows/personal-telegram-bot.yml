name: Legion-OSINT personal Telegram bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: legion-osint-personal-bot
  cancel-in-progress: false

jobs:
  telegram-command-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore bot database and Telegram update offset
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: legion-osint-bot-${{ github.run_id }}
          restore-keys: |
            legion-osint-bot-

      - name: Download latest scheduled Telegram collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/incoming
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/public-telegram-collection.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name legion-osint-public-telegram-latest --dir data/incoming
          else
            echo "No successful scheduled collection run exists yet; bot will start with its existing database."
          fi

      - name: Install bot dependencies
        run: pip install -r requirements.txt

      - name: Process pending Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          DATABASE_PATH: data/legion_osint.sqlite3
          LEGION_BOT_DATA_DIR: data
          PYTHONUNBUFFERED: "1"
        run: python -m app.bot_action_worker

      - name: Save updated bot database and Telegram offset
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: legion-osint-bot-${{ github.run_id }}

      - name: Remove older bot-state caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: legion-osint-bot-${{ github.run_id }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key != env.CACHE_KEY) | .id' |
          while read -r cache_id; do
            [ -z "$cache_id" ] || gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/caches/$cache_id" || true
          done
