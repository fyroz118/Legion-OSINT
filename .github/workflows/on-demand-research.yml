name: Run Legion-OSINT on demand

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Reporting date in Asia/Dhaka (YYYY-MM-DD)"
        required: true
        type: string
      posts_per_channel:
        description: "Maximum public preview messages to inspect per configured channel"
        required: true
        type: choice
        options: ["100", "300", "500"]
        default: "300"

permissions:
  contents: read

concurrency:
  group: legion-osint-manual-run
  cancel-in-progress: false

jobs:
  telegram-gemini-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          python -m py_compile scripts/run_telegram_gemini.py
          python -c "import os; from datetime import datetime; datetime.strptime(os.environ['REPORT_DATE'], '%Y-%m-%d')"
      - name: Collect public Telegram previews and generate Gemini report
        env:
          COLLECT_LIMIT_PER_CHANNEL: ${{ inputs.posts_per_channel }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          DATABASE_PATH: ${{ runner.temp }}/legion_osint.sqlite3
        run: python scripts/run_telegram_gemini.py "${{ inputs.report_date }}"
      - name: Upload report and evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legion-osint-public-telegram-gemini-${{ inputs.report_date }}
          path: output/${{ inputs.report_date }}/
          if-no-files-found: warn
          retention-days: 14
